name: Deploy dotme → kevinphan.me

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-dotme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & build frontend
        run: |
          npm ci
          npm run build

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /root/project/dotme
            git fetch origin
            git reset --hard origin/main
            npm ci --omit=dev
            npm run build
            pm2 reload dotme-api --update-env || pm2 start server/index.js \
              --name dotme-api \
              --node-args="--env-file=/root/project/dotme/.env" \
              --cwd /root/project/dotme
            pm2 save
            echo "Deployed $(git rev-parse --short HEAD)"
