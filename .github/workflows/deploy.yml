name: Deploy dotme to kevinphan.me

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-dotme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        env:
          SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy over SSH
        run: |
          H=$(echo '${{ secrets.SERVER_HOST }}' | tr -d '[:space:]')
          U=$(echo '${{ secrets.SERVER_USER }}' | tr -d '[:space:]')
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -l "$U" "$H" \
            "set -e && cd /root/project/dotme && git fetch origin && git reset --hard origin/main && npm ci --omit=dev && npm run build && pm2 reload dotme-api --update-env && pm2 save && echo done"
