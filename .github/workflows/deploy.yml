name: Deploy dotme → kevinphan.me

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & build frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          # Write key to file
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Disable host key checking
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

          # Deploy via SSH
          ssh -i ~/.ssh/deploy_key $USER@$HOST << 'ENDSSH'
            set -e
            cd /root/project/dotme
            git pull origin main
            npm ci --omit=dev
            npm run build
            pm2 reload dotme-api --update-env || pm2 start server/index.js \
              --name dotme-api \
              --node-args="--env-file=/root/project/dotme/.env" \
              --cwd /root/project/dotme
            pm2 save
            echo "✅ Deploy done"
ENDSSH
